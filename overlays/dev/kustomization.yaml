apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

# Replica count is owned by the HPA (base minReplicas 1), not pinned here, so Argo
# selfHeal does not fight the autoscaler.

# Bind the app SA to the dev GCP service account (Workload Identity).
patches:
- patch: |-
    - op: add
      path: /metadata/annotations
      value:
        iam.gke.io/gcp-service-account: storycover-app@storycover-dev.iam.gserviceaccount.com
  target:
    kind: ServiceAccount
    name: storycover-app

configMapGenerator:
- behavior: merge
  literals:
  - GCS_BUCKET=storycover-dev-covers
  name: storycover-env

# CI rewrites newTag to the pushed git SHA via "kustomize edit set image".
images:
- name: storycover-app
  newName: me-central1-docker.pkg.dev/storycover-dev/storycover/storycover-app
  newTag: b0c17a21aadf9eddcd119eb7aaf1779e85b91241
