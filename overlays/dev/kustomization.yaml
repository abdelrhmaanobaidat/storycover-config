apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

replicas:
- count: 1
  name: storycover

configMapGenerator:
- behavior: merge
  literals:
  - GCS_BUCKET=storycover-dev-covers
  name: storycover-env

# CI rewrites newTag to the pushed git SHA via "kustomize edit set image".
# The bootstrap tag is a placeholder for the first build only; never latest.
images:
- name: storycover-app
  newName: me-central1-docker.pkg.dev/storycover-dev/storycover/storycover-app
  newTag: 7b929b2f6b9e23903166bd329286aa2dea51eb28
